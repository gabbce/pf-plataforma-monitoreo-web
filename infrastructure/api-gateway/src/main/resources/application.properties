spring.application.name=api-gateway
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

platform.management-url=${PLATFORM_MANAGEMENT_URL:http://127.0.0.1:8081}
platform.records-url=${PLATFORM_RECORDS_URL:http://127.0.0.1:8082}

spring.cloud.gateway.server.webflux.routes[0].id=station-records
spring.cloud.gateway.server.webflux.routes[0].uri=${platform.records-url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/integration/v1/records,false
spring.cloud.gateway.server.webflux.routes[0].predicates[1]=Method=POST

spring.cloud.gateway.server.webflux.routes[1].id=station-configuration
spring.cloud.gateway.server.webflux.routes[1].uri=${platform.management-url}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/integration/v1/configuration,false
spring.cloud.gateway.server.webflux.routes[1].predicates[1]=Method=GET

spring.cloud.gateway.server.webflux.routes[2].id=station-configuration-results
spring.cloud.gateway.server.webflux.routes[2].uri=${platform.management-url}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/integration/v1/configuration-results,false
spring.cloud.gateway.server.webflux.routes[2].predicates[1]=Method=POST

spring.cloud.gateway.server.webflux.routes[3].id=web-auth-csrf
spring.cloud.gateway.server.webflux.routes[3].uri=${platform.management-url}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/auth/csrf,false
spring.cloud.gateway.server.webflux.routes[3].predicates[1]=Method=GET

spring.cloud.gateway.server.webflux.routes[4].id=web-auth-session
spring.cloud.gateway.server.webflux.routes[4].uri=${platform.management-url}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/auth/session,false
spring.cloud.gateway.server.webflux.routes[4].predicates[1]=Method=POST

spring.cloud.gateway.server.webflux.routes[5].id=web-machines
spring.cloud.gateway.server.webflux.routes[5].uri=${platform.management-url}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/v1/machines,false
spring.cloud.gateway.server.webflux.routes[5].predicates[1]=Method=GET

spring.cloud.gateway.server.webflux.routes[6].id=web-machine-detail
spring.cloud.gateway.server.webflux.routes[6].uri=${platform.management-url}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/v1/machines/{chassis},false
spring.cloud.gateway.server.webflux.routes[6].predicates[1]=Method=GET

spring.cloud.gateway.server.webflux.routes[7].id=web-auth-logout
spring.cloud.gateway.server.webflux.routes[7].uri=${platform.management-url}
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/v1/auth/session,false
spring.cloud.gateway.server.webflux.routes[7].predicates[1]=Method=DELETE
