name: pfc-platform

x-java: &java
  healthcheck:
    test: ["CMD-SHELL", 'curl -fsS "http://127.0.0.1:$${SERVER_PORT}/actuator/health" >/dev/null']
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 20s

services:
  management:
    <<: *java
    build:
      context: ../..
      dockerfile: infrastructure/platform/java.Dockerfile
      target: runtime
      args:
        MODULE: backend/management
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/management
      SPRING_DATASOURCE_USERNAME: management_app
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
    secrets:
      - source: management_db_password
        target: spring.datasource.password
    networks:
      - default
      - management-db
    depends_on:
      postgres:
        condition: service_healthy
      provision-management:
        condition: service_completed_successfully

  records:
    <<: *java
    build:
      context: ../..
      dockerfile: infrastructure/platform/java.Dockerfile
      target: runtime
      args:
        MODULE: backend/records
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8082"
    depends_on:
      mongodb:
        condition: service_healthy

  gateway:
    <<: *java
    build:
      context: ../..
      dockerfile: infrastructure/platform/java.Dockerfile
      target: runtime
      args:
        MODULE: infrastructure/api-gateway
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      PLATFORM_MANAGEMENT_URL: http://management:8081
      PLATFORM_RECORDS_URL: http://records:8082

  nginx:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8095:80"
    networks:
      - default
      - ingress
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 6

  postgres:
    image: postgres:19.0-trixie@sha256:bb6e70add742cd868fb62cb3b2f67d1dd2bdd2b65a521e778420748753687c60
    environment:
      POSTGRES_DB: management
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - management-db
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "management"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  provision-management:
    image: postgres:19.0-trixie@sha256:bb6e70add742cd868fb62cb3b2f67d1dd2bdd2b65a521e778420748753687c60
    user: postgres
    entrypoint: ["/bin/sh", "/provision-management.sh"]
    environment:
      PGHOST: postgres
    volumes:
      - ./provision-management.sh:/provision-management.sh:ro
    secrets:
      - postgres_password
      - management_db_password
    networks:
      - management-db
    depends_on:
      postgres:
        condition: service_healthy

  mongodb:
    image: mongo:9.0.8-resolute@sha256:1c2e2674ed3adde7edcfe83f7a7a5cbe0204521161d4199ab34e9ec3da2db5c4
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
    secrets:
      - mongo_password
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "mongodb", "--eval", "if (!db.adminCommand({ ping: 1 }).ok) quit(1)"]
      interval: 5s
      timeout: 8s
      retries: 12
      start_period: 20s

networks:
  default:
    internal: true
  ingress: {}
  management-db:
    internal: true

volumes:
  postgres_data:
  mongo_data:
  mongo_config:

secrets:
  postgres_password:
    file: ../../.runtime/platform/secrets/postgres-password
  management_db_password:
    file: ../../.runtime/platform/secrets/management-db-password
  mongo_password:
    file: ../../.runtime/platform/secrets/mongo-password
