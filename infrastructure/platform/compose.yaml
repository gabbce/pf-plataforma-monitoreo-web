name: pfc-platform

x-java: &java
  healthcheck:
    test: ["CMD-SHELL", 'curl -fsS "http://127.0.0.1:$${SERVER_PORT}/actuator/health" >/dev/null']
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 20s

services:
  management:
    <<: *java
    build:
      context: ../..
      dockerfile: infrastructure/platform/java.Dockerfile
      target: runtime
      args:
        MODULE: backend/management
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8081"
    depends_on:
      postgres:
        condition: service_healthy

  records:
    <<: *java
    build:
      context: ../..
      dockerfile: infrastructure/platform/java.Dockerfile
      target: runtime
      args:
        MODULE: backend/records
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8082"
    depends_on:
      mongodb:
        condition: service_healthy

  gateway:
    <<: *java
    build:
      context: ../..
      dockerfile: infrastructure/platform/java.Dockerfile
      target: runtime
      args:
        MODULE: infrastructure/api-gateway
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"

  nginx:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 6

  postgres:
    image: postgres:19.0-trixie@sha256:bb6e70add742cd868fb62cb3b2f67d1dd2bdd2b65a521e778420748753687c60
    environment:
      POSTGRES_DB: management
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "management"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  mongodb:
    image: mongo:9.0.8-resolute@sha256:1c2e2674ed3adde7edcfe83f7a7a5cbe0204521161d4199ab34e9ec3da2db5c4
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
    secrets:
      - mongo_password
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "mongodb", "--eval", "if (!db.adminCommand({ ping: 1 }).ok) quit(1)"]
      interval: 5s
      timeout: 8s
      retries: 12
      start_period: 20s

networks:
  default:
    internal: true

volumes:
  postgres_data:
  mongo_data:
  mongo_config:

secrets:
  postgres_password:
    file: ../../.runtime/platform/secrets/postgres-password
  mongo_password:
    file: ../../.runtime/platform/secrets/mongo-password
