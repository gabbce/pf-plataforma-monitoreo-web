log_format platform '$remote_addr "$request_method $uri" $status';

upstream platform_gateway {
    zone platform_gateway 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server gateway:8080 resolve;
}

server {
    listen 80;
    server_name localhost host.docker.internal;

    access_log /var/log/nginx/access.log platform;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(api|integration)(/|$) {
        proxy_set_header Host $http_host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_pass http://platform_gateway;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
